version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Eco-Router Monitoring Stack (Phase G)
#
# Extends docker-compose.yml with proper monitoring directory mounts.
# Includes Prometheus + Grafana with the ECO-ROUTER dashboard pre-provisioned.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up
#
# Grafana UI: http://localhost:3001
#   Default credentials: admin / eco_router_admin
#   (Change via GRAFANA_PASSWORD in .env)
#
# Prometheus UI: http://localhost:9090
# ─────────────────────────────────────────────────────────────────────────────

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    restart: unless-stopped
    networks:
      - eco-net

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-eco_router_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/eco-router.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - eco-net

volumes:
  prometheus_data:
  grafana_data:

networks:
  eco-net:
    driver: bridge
