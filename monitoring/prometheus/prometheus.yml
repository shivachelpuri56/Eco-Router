global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'eco-router'
    environment: 'local'

scrape_configs:
  - job_name: 'eco-router'
    static_configs:
      - targets: ['eco-router:8000']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 8s
